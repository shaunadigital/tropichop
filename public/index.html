<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a1a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Swipe to chop tropical fruit. Watch out for the hazards!">
<title>TropiChop</title>
<link rel="icon" href="img/hibiscus.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff8ec; --ink-dim:#f3dcc0; --panel:rgba(42,24,12,.78); --panel-edge:rgba(255,214,140,.35);
  --gold:#ffc83a; --gold-deep:#ff8a1c; --red:#e8402f; --leaf:#2f9a4a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2a1a10;color:var(--ink);font-family:Nunito,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--safe-t)) 16px 0;display:flex;align-items:flex-start;
  justify-content:space-between;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
.hud.on{opacity:1}
.score{font-family:'Lilita One',sans-serif;font-size:clamp(34px,8vw,52px);line-height:1;color:var(--gold);
  -webkit-text-stroke:2px #5a2a08;paint-order:stroke fill;text-shadow:0 3px 0 #5a2a08}
.best{font-size:14px;font-weight:800;color:var(--ink-dim);margin-top:4px;text-shadow:0 1px 3px #000}
.lives{display:flex;gap:4px}
.lives img{width:clamp(30px,7vw,42px);height:auto;transition:filter .3s,transform .3s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.lives img.lost{filter:grayscale(1) brightness(.6) opacity(.55);transform:scale(.8)}
.pause{pointer-events:auto;position:fixed;top:calc(12px + var(--safe-t));left:50%;transform:translateX(-50%);
  width:44px;height:44px;border-radius:50%;border:2px solid var(--panel-edge);background:var(--panel);color:var(--ink);
  font:800 16px Nunito,sans-serif;cursor:pointer;z-index:3;display:none}
.pause.on{display:block}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));z-index:5;text-align:center;overflow-y:auto}
.screen.on{display:flex}
.screen.dim{background:rgba(20,10,4,.55)}
.logo{width:min(560px,92vw);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.card{background:var(--panel);border:2px solid var(--panel-edge);border-radius:20px;padding:18px 20px;margin-top:14px;
  width:min(420px,100%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(40px,11vw,64px);color:var(--gold);
  -webkit-text-stroke:2px #5a2a08;paint-order:stroke fill;text-shadow:0 4px 0 #5a2a08;line-height:1}
.btn{display:inline-block;border:0;border-radius:999px;padding:14px 34px;margin:6px;cursor:pointer;
  font-family:'Lilita One',sans-serif;font-size:24px;letter-spacing:.5px;color:#4a1e02;
  background:linear-gradient(#ffe066,var(--gold) 45%,var(--gold-deep));box-shadow:0 5px 0 #a24a08,0 8px 16px rgba(0,0,0,.35);
  transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a24a08}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:none;border:2px solid var(--panel-edge);font-size:18px;padding:10px 22px}
.how{font-size:15px;line-height:1.45;color:var(--ink-dim);margin-top:10px}
.how b{color:var(--ink)}
.how .haz{height:34px;width:auto;vertical-align:middle;margin:0 2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.bgpick{display:flex;gap:12px;justify-content:center;margin-top:12px}
.bgopt{position:relative;width:118px;border-radius:12px;overflow:hidden;border:3px solid transparent;cursor:pointer;
  background:none;padding:0;color:var(--ink);font:800 13px Nunito,sans-serif}
.bgopt img{display:block;width:100%;height:66px;object-fit:cover}
.bgopt span{display:block;padding:5px 0;background:rgba(0,0,0,.45)}
.bgopt.sel{border-color:var(--gold)}
.bgopt.locked img{filter:grayscale(1) brightness(.45)}
.bgopt .lock{position:absolute;inset:0 0 auto 0;height:66px;display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1.25;padding:0 6px;text-shadow:0 1px 2px #000}
.row{display:flex;justify-content:center;flex-wrap:wrap;align-items:center}
.small{font-size:13px;color:var(--ink-dim)}
.big{font-family:'Lilita One',sans-serif;font-size:56px;color:var(--ink);line-height:1.1}
.newbest{color:var(--gold);font-weight:800;font-size:18px;min-height:24px}
.toast{position:fixed;left:50%;top:calc(80px + var(--safe-t));transform:translate(-50%,-30px);opacity:0;z-index:6;
  background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:10px 16px;display:flex;align-items:center;gap:10px;
  font-weight:800;pointer-events:none;transition:opacity .35s,transform .35s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast img{width:64px;height:40px;object-fit:cover;border-radius:8px}
.more{display:inline-block;margin-top:12px;color:var(--ink-dim);font-weight:800;font-size:14px;text-underline-offset:3px}
.more:hover,.more:focus-visible{color:var(--gold)}
.loading{font-family:'Lilita One',sans-serif;font-size:22px;color:var(--ink-dim)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <div><div class="score" id="score">0</div><div class="best" id="bestHud"></div></div>
  <div class="lives" id="lives"></div>
</div>
<button class="pause" id="pauseBtn" aria-label="Pause">II</button>

<div class="screen on" id="loadScreen"><div class="loading">Loading…</div></div>

<div class="screen" id="menu">
  <img class="logo" src="img/logo.webp" alt="TropiChop">
  <div class="card">
    <button class="btn" id="playBtn">Play</button>
    <div class="how"><b>Swipe</b> to chop the fruit. Don't let any drop!<br>
      Coconuts and pineapples take extra chops. Starfruit is lucky.<br>
      Don't chop these: <img class="haz" src="img/slippah.webp" alt="blue slipper"> <img class="haz" src="img/wana.webp" alt="sea urchin"></div>
    <div class="bgpick" id="bgpick"></div>
    <div class="row" style="margin-top:12px">
      <span class="small" id="bestMenu"></span>
      <button class="btn ghost" id="soundBtn" style="margin-left:10px">Sound: On</button>
    </div>
    <a class="more" href="https://games.shauna.digital/">More games</a>
  </div>
</div>

<div class="screen dim" id="paused">
  <h2>Paused</h2>
  <div class="card"><button class="btn" id="resumeBtn">Resume</button><br><button class="btn ghost" id="quitBtn">Quit to menu</button></div>
</div>

<div class="screen dim" id="over">
  <h2>Game Over!</h2>
  <div class="card">
    <div class="small">Score</div>
    <div class="big" id="finalScore">0</div>
    <div class="newbest" id="newBest"></div>
    <div class="small" id="bestOver"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="againBtn">Play again</button>
      <button class="btn ghost" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><img src="img/bg-beach.webp" alt=""><span>New background unlocked: <b>Beach Sunset</b>!</span></div>

<script src="game.js"></script>
</body>
</html>
